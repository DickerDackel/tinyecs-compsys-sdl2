[project]
name = "tinyecs-compsys-sdl2"
description = "pygame-ce SDL2 component and system library for tinyecs"
version = "0.0.4"
readme = "README.rst"

authors = [
    { name="Michael Lamertz", email="michael.lamertz@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: pygame",
]

license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    'aenum',
    'pgcooldown',
    'pygame-ce',
    'pyglm',
    'tinyecs >= 0.5.0',
    'tinyecs-compsys',
    'tinyecs-compsys-dynamics',
]

[project.urls]
homepage = "https://github.com/dickerdackel/tinyecs-compsys-sdl2"
bugtracker = "https://github.com/dickerdackel/tinyecs-compsys-sdl2/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
